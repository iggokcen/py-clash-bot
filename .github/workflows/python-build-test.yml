name: Build test packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-offline:
    name: Run Offline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run offline tests
        run: |
          uv run --group dev pytest -q


  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: [test-offline]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build package
        run: |
          uv run --group build scripts/setup_msi.py bdist_msi --target-version v0.0.0
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-clash-bot-test-windows.msi
          path: ./dist/pyclashbot*.msi
          retention-days: 30

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build package
        run: |
          uv run --group build scripts/setup_macos.py --target-version v0.0.0
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-clash-bot-test-macos.dmg
          path: ./dist/py-clash-bot*.dmg
          retention-days: 30
